services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hiwhale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiwhale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiwhale_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hiwhale}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiwhale} -d ${POSTGRES_DB:-hiwhale}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiwhale-network

  # Redis for session/cache/job queue
  redis:
    image: redis:7-alpine
    container_name: hiwhale-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-hiwhale_dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hiwhale_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiwhale-network

  # MinIO object storage for images/PDFs/3D models
  minio:
    image: minio/minio:latest
    container_name: hiwhale-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hiwhale}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hiwhale_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hiwhale-network

  # Text Embeddings Inference for bge-m3 (optional, requires HF_TOKEN)
  # tei:
  #   image: ghcr.io/huggingface/text-embeddings-inference:latest
  #   container_name: hiwhale-tei
  #   restart: unless-stopped
  #   command: --model-id BAAI/bge-m3 --port 8080
  #   environment:
  #     - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
  #   volumes:
  #     - tei_data:/data
  #   ports:
  #     - "${TEI_PORT:-8080}:8080"
  #   networks:
  #     - hiwhale-network

  # API 后端（NestJS）
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: hiwhale-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiwhale}:${POSTGRES_PASSWORD:-hiwhale_dev}@postgres:5432/${POSTGRES_DB:-hiwhale}
      REDIS_URL: redis://default:${REDIS_PASSWORD:-hiwhale_dev}@redis:6379
      # 生产必填：JWT 签名密钥（缺失时 api 启动即报错）
      JWT_SECRET: ${JWT_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-HiWhale Robotics <noreply@hiwhalerobotics.com>}
      # 逗号分隔；本地 docker 开发默认 localhost，生产在根 .env 覆盖为正式域名
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hiwhale}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hiwhale_dev}
      # 上传文件的公网访问前缀（生产必须可达，否则全站图片 404）
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/hiwhale-uploads}
      PORTAL_PUBLIC_DIR: /portal-public
    volumes:
      - portal_images:/portal-public/images
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hiwhale-network

  # 一次性初始化：数据库迁移 + MinIO bucket 初始化（随 up 自动执行，完成后退出）
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: hiwhale-migrate
    command: >
      sh -c "node /app/api/node_modules/prisma/build/index.js migrate deploy
      && node scripts/init-minio.js"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiwhale}:${POSTGRES_PASSWORD:-hiwhale_dev}@postgres:5432/${POSTGRES_DB:-hiwhale}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hiwhale}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hiwhale_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-hiwhale-uploads}
      npm_config_cache: /tmp/.npm
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hiwhale-network

  # 门户（Next.js standalone）
  portal:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
      args:
        # 构建期内联进前端 bundle；生产在根 .env 覆盖为 https://api.<正式域名>
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: hiwhale-portal
    restart: unless-stopped
    volumes:
      - portal_images:/app/apps/portal/public/images
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - hiwhale-network

  # 管理后台（Next.js standalone）
  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000}
    container_name: hiwhale-admin
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      - api
    networks:
      - hiwhale-network

  # 反向代理（唯一对外端口）
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: hiwhale-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 生产启用 HTTPS 时取消注释（需先在 nginx.conf 中启用 443 server 块并挂载证书）
      # - "443:443"
    depends_on:
      - portal
      - admin
      - api
    networks:
      - hiwhale-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  tei_data:
  portal_images:

networks:
  hiwhale-network:
    driver: bridge

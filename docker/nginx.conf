# HiWhale 站点反向代理
#
# 当前为「本地/测试」HTTP-only 配置，开箱即用（docker compose up）。
# 生产 HTTPS 配置见文件末尾注释块：挂载证书后取消注释并注释掉下方 HTTP server 块。

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff font/woff2;
  gzip_min_length 1k;

  client_max_body_size 100M;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # ---------- 门户 hiwhale.com ----------
  server {
    listen 80;
    server_name hiwhale.com www.hiwhale.com localhost;

    # Next 静态资源长缓存
    location /_next/static/ {
      proxy_pass http://portal:3000;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    location /images/ {
      proxy_pass http://portal:3000;
      expires 1h;
      add_header Cache-Control "public, must-revalidate";
    }

    location / {
      proxy_pass http://portal:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------- 管理后台 admin.hiwhale.com ----------
  server {
    listen 80;
    server_name admin.hiwhale.com;

    location /_next/static/ {
      proxy_pass http://admin:3001;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://admin:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------- API api.hiwhale.com ----------
  server {
    listen 80;
    server_name api.hiwhale.com;

    # CORS：仅允许门户域名
    set $cors_origin "";
    if ($http_origin ~* ^https?://(www\.)?hiwhale\.com$) {
      set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) {
      return 204;
    }

    location / {
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ==========================================================================
  # 生产 HTTPS 配置（启用步骤）：
  #   1. 将证书挂载到 /etc/nginx/ssl/（hiwhale.com.pem 与 hiwhale.com.key），
  #      例如在 compose 的 nginx 服务中添加：
  #        volumes:
  #          - ./docker/ssl:/etc/nginx/ssl:ro
  #   2. 注释掉上方三个 listen 80 的 server 块，取消注释下方配置。
  #   3. 在 compose 中开放 443 端口。
  # ==========================================================================
  #
  # # HTTP → HTTPS 跳转
  # server {
  #   listen 80;
  #   server_name hiwhale.com www.hiwhale.com admin.hiwhale.com api.hiwhale.com;
  #   return 301 https://$host$request_uri;
  # }
  #
  # server {
  #   listen 443 ssl;
  #   server_name hiwhale.com www.hiwhale.com;
  #   ssl_certificate     /etc/nginx/ssl/hiwhale.com.pem;
  #   ssl_certificate_key /etc/nginx/ssl/hiwhale.com.key;
  #
